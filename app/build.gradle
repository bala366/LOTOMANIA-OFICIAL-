plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.lotomania.talopy'
    compileSdk 35

    defaultConfig {
        applicationId "com.lotomania.talopy"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "4.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}
